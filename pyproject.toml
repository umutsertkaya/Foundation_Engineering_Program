[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geotek"
version = "0.1.0"
description = "Geotechnical engineering suite: in-situ tests, liquefaction and retaining structure design"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
report = ["python-docx>=1.1"]
web = ["fastapi>=0.140", "uvicorn>=0.50", "pywebview>=6.0"]
package = ["pyinstaller>=6.20"]
dev = ["pytest>=8", "hypothesis>=6.90", "ruff>=0.4", "mypy>=1.8", "httpx>=0.28"]

[tool.setuptools.packages.find]
include = ["geotek*"]

[tool.setuptools.package-data]
"geotek.config" = ["design_codes/*.yaml"]
"geotek.i18n" = ["*.json"]
"geotek.modules" = ["*/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
