name: build-exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["geotek/**", "web/**", "tools/build_exe.ps1", "tools/geotek_exe.py", ".github/workflows/build-exe.yml"]

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build exe
        shell: pwsh
        run: ./tools/build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GeoTek-windows-exe
          path: dist/GeoTek.exe
          if-no-files-found: error
      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GeoTek.exe
